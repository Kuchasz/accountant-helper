name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        required: true
        default: latest
      dockerfile:
        description: Dockerfile to build
        required: true
        type: choice
        default: packages/api/Dockerfile
        options:
          - packages/api/Dockerfile
          - packages/web/Dockerfile
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: kuchasz/accountant-helper
  DEFAULT_DOCKERFILE: packages/api/Dockerfile

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "dockerfile=${{ inputs.dockerfile }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "dockerfile=${DEFAULT_DOCKERFILE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
