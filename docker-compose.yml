services:
  api:
    image: kuchasz/accountant-helper:api-latest
    pull_policy: always
    ports:
      - '4005:4005'
    volumes:
      - api-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4005
      - DATABASE_URL=/app/data/db.sqlite
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:4005/health']
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: kuchasz/accountant-helper:web-latest
    pull_policy: always
    ports:
      - '4006:4006'
    volumes:
      - ./packages/web/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - API_UPSTREAM=api:4005
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
